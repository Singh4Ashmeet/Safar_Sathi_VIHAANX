services:
  - type: web
    name: safarsaathi-api
    runtime: node
    plan: free
    region: frankfurt # or singapore
    buildCommand: pnpm install && pnpm --filter api-server build
    startCommand: pnpm --filter api-server start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SERVER_BOX_SECRET_KEY
        sync: false
      - key: SERVER_BOX_PUBLIC_KEY
        sync: false
      - key: SMS_PROVIDER
        value: android-gateway
      - key: SMS_GATEWAY_URL
        sync: false
      - key: SMS_GATEWAY_USER
        sync: false
      - key: SMS_GATEWAY_PASSWORD
        sync: false
      - key: SMS_GATEWAY_PASSPHRASE
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: SMTP_URL
        sync: false
      - key: ORS_API_KEY
        sync: false
      - key: ROUTING_DAILY_LIMIT
        value: 1800
      - key: TICK_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GUARDIAN_TILE_URL
        value: https://tile.openstreetmap.org/{z}/{x}/{y}.png
      - key: WATCHDOG_SIGNAL_LOST_SEC
        value: 180
      - key: WATCHDOG_LOST_CONTACT_SEC
        value: 300
      - key: WATCHDOG_ETA_GRACE_SEC
        value: 600
      - key: RETENTION_TRIP_POINTS_DAYS
        value: 7

